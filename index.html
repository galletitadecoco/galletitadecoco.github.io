<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Constancia Domiciliaria | Iniciar sesión</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="login-container">

        <section class="login-card" aria-labelledby="titulo">

            <!-- Logo -->
            <div class="logo">

                <div class="logo-icon" aria-hidden="true">
                    🏠
                </div>

                <h1 id="titulo">
                    Constancia
                    <span>Domiciliaria</span>
                </h1>

            </div>

            <!-- Bienvenida -->
            <p class="welcome">
                Bienvenido/a
            </p>

            <p class="subtitle">
                Ingresa tus datos para acceder al módulo de solicitud.
            </p>

            <!-- Formulario -->
            <form id="loginForm" action="#" method="post">

                <!-- Usuario -->
                <div class="input-group">

                    <label for="usuario">
                        Usuario
                    </label>

                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        placeholder="Ingresa tu usuario"
                        autocomplete="username"
                        required
                    >

                </div>

                <!-- Contraseña -->
                <div class="input-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Ingresa tu contraseña"
                        autocomplete="current-password"
                        required
                    >

                </div>

                <!-- Opciones -->
                <div class="options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="recordarme"
                            name="recordarme"
                        >

                        <span>Recordarme</span>

                    </label>

                    <a href="recuperar.html">
                        ¿Olvidaste tu contraseña?
                    </a>

                </div>

                <!-- Botón -->
                <button type="submit">
                    Iniciar sesión
                </button>

            </form>

            <!-- Separador -->
            <div class="divider" aria-hidden="true">
                <span>o</span>
            </div>

            <!-- Registro -->
            <p class="register">
                ¿No tienes una cuenta?

                <a href="registro.html">
                    Crear cuenta
                </a>
            </p>

        </section>

        <!-- Pie -->
        <footer>
            &copy; 2026 Melany Sarahi Hernández Bajonero
        </footer>

    </main>

    <!-- JavaScript -->
    <script src="js/script.js"></script>

</body>

</html>
